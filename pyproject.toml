[project]
name = "rubik"
version = "0.1.0"
description = "教育用のルービックキューブライブラリ。リスト表現・18通りの操作・マウスで回せる3D表示。"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "hitoponu", email = "121503258+hitoponu@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.1",
]

[build-system]
requires = ["uv_build>=0.8.8,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "notebook>=7.6.1",
]
